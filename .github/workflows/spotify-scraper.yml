name: 2222scouter Monthly Listener Tracker

on:
  schedule:
    - cron: '0 22 * * *'   # Every day at 10:00 PM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.44

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas

      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" == "true" ]; then
            playwright install-deps chromium
          else
            playwright install --with-deps chromium
          fi

      - name: Run scraper
        run: python spotify_listeners_tracker.py

      # ←←← Best place: right here at the end
      - name: Commit and push results
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update Spotify listeners history"
          file_pattern: spotify_listeners_history.csv
