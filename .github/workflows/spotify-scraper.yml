name: 2222scouter Monthly Listener Tracker

on:
  schedule:
    - cron: '0 22 * * *'   # Every day at 10:00 PM UTC
  workflow_dispatch:        # Allow manual runs

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Cache pip packages so they don't re-download every run
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Cache Playwright browser binary so it doesn't re-download every run (~150MB, saves ~2 min)
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.44

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas requests

      - name: Install Playwright Chromium (and system deps)
        # Only run full install if cache missed; if cache hit, just install system deps
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" == "true" ]; then
            playwright install-deps chromium
          else
            playwright install --with-deps chromium
          fi

      - name: Run scraper
        run: python spotify_listeners_tracker.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spotify_listeners_history.csv spotify_streams_history.csv dashboard.html || true
          git diff --cached --quiet || git commit -m "Daily update $(date +'%Y-%m-%d %H:%M UTC')"
          git push || echo "Nothing to push"
